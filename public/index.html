<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Manrope:wght@500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Darkroom contact sheet: neutral paper/film-base greys, one safelight-red accent,
   mono for camera data and times. Mobile: one column + bottom bar; desktop: two-column editor. */
:root{
  --bg:#ECEDEB; --surface:#FBFBF9; --ink:#111314; --muted:#4A4F52; --line:#D3D6D3;
  --accent:#C2302A; --accent-ink:#FFFFFF; --amber:#A86A12; --ok:#2B7A4B; --chip:#E3E5E2;
  --display:"Outfit", system-ui, sans-serif;
  --body:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F10; --surface:#17191A; --ink:#ECEDEA; --muted:#B2B7BA; --line:#2B2E30;
    --accent:#FF5A4E; --accent-ink:#1A0806; --amber:#E8A33D; --ok:#5DBB82; --chip:#222527;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F10; --surface:#17191A; --ink:#ECEDEA; --muted:#B2B7BA; --line:#2B2E30;
  --accent:#FF5A4E; --accent-ink:#1A0806; --amber:#E8A33D; --ok:#5DBB82; --chip:#222527;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15.5px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
img,canvas{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
h2{font:900 31px/1.05 var(--display);letter-spacing:-.02em}
h3{font:700 12px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font:800 24px/1 Manrope, system-ui, sans-serif;letter-spacing:-.02em;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:30px;height:30px;color:var(--ink);flex:0 0 auto}
.brand b{font-weight:800;color:var(--accent)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--amber)}
.tabs{display:none;gap:4px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom button{border:0;background:transparent;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="true"]{color:var(--accent)}
@media (min-width:820px){ .tabs{display:flex} .bottom{display:none} body{padding-bottom:24px} }

main{max-width:1180px;margin:0 auto;padding:16px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.view-head p{margin:2px 0 0}

/* surfaces + controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label.f span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=datetime-local],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px}
textarea{resize:vertical;min-height:80px;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.scheduled{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pill.posted{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.due{background:var(--accent);color:var(--accent-ink)}

/* editor */
.editor{display:grid;gap:16px}
@media (min-width:980px){ .editor{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start} .ed-left{position:sticky;top:70px} }
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:center}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.drop strong{font:900 22px/1.15 var(--display);letter-spacing:-.01em}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.thumb{position:relative;flex:0 0 auto;width:64px;height:80px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-selected="true"]{border-color:var(--accent)}
.thumb .n{position:absolute;left:4px;top:3px;font:600 10px var(--mono);background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 4px}
.thumb .x{position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:20px;padding:0;cursor:pointer}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.slide{flex:0 0 auto;width:min(78%,340px);scroll-snap-align:start;position:relative}
.slide canvas{width:100%;height:auto;border-radius:6px;background:#000}
.slide .gridmask{position:absolute;inset:0;pointer-events:none}
.slide .cap{font:500 11px var(--mono);color:var(--muted);margin-top:4px}
.focal{position:relative;border-radius:10px;overflow:hidden;background:#000;cursor:crosshair;touch-action:none}
.focal img{width:100%;max-height:360px;object-fit:contain}
.focal .ch{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.45);pointer-events:none}
.exif{display:flex;gap:6px;flex-wrap:wrap}
.exif span{background:var(--chip);border-radius:6px;padding:2px 7px}
.hooks{display:flex;flex-direction:column;gap:6px}
.hook{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}
.hook:hover{border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:3px 4px 3px 10px;font-size:13.5px;font-weight:600}
.tag button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.tags input{border:0;background:transparent;flex:1;min-width:120px;padding:4px;font-size:14px}
.tags input:focus{outline:none}
.count{font:500 12px var(--mono);color:var(--muted)}
.count.over{color:var(--accent);font-weight:700}
.final{white-space:pre-wrap;word-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;max-height:340px;overflow:auto}
.final .cut{display:inline;border-bottom:2px solid var(--accent)}
.final .fold{color:var(--muted)}
.aiwait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tip{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:14px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}

/* grid */
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:540px}
.tile{position:relative;aspect-ratio:3/4;background:var(--chip);overflow:hidden;cursor:pointer;border:0;padding:0}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .b{position:absolute;left:5px;bottom:5px}
.tile .ic{position:absolute;right:6px;top:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tile.past{opacity:.92}
.grid-wrap{display:grid;gap:16px}
@media (min-width:900px){ .grid-wrap{grid-template-columns:540px 1fr;align-items:start} }
.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--amber));flex:0 0 auto}

/* plan */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font:900 38px/1 var(--display);letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:640px){ .days{grid-template-columns:repeat(4,minmax(0,1fr))} }
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px;min-height:92px;display:flex;flex-direction:column;gap:4px}
.day.today{border-color:var(--accent)}
.day .d{font:600 11px var(--mono);color:var(--muted)}
.slot{font:500 11px var(--mono);border:1px dashed var(--line);border-radius:6px;padding:2px 4px;color:var(--muted)}
.slot.filled{border:0;padding:0;display:flex;gap:4px;align-items:center;color:var(--ink);cursor:pointer;background:transparent;width:100%;text-align:left}
.slot.filled img{width:22px;height:28px;object-fit:cover;border-radius:3px}
.qitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}
.qitem img{width:52px;height:68px;object-fit:cover;border-radius:6px;background:var(--chip)}
.qitem .meta{flex:1;min-width:0}
.qitem .meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{font:500 12.5px var(--mono);background:var(--chip);border-radius:999px;padding:3px 4px 3px 9px;display:inline-flex;align-items:center;gap:2px}
.tchip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px}
.wk input[type=time]{width:auto;padding:3px 6px;font-size:13px}
.two{display:grid;gap:16px}
.two>*,.wk>*,.editor>*{min-width:0}
.wk input[type=time]{max-width:118px}
@media (min-width:900px){ .two{grid-template-columns:1fr 1fr;align-items:start} }

.banner{background:color-mix(in srgb,var(--amber) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.empty{padding:22px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.saved-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.saved-imgs img{border-radius:6px}
/* reach check + results */
.rsum{display:flex;gap:6px;flex-wrap:wrap}
.rc{display:grid;grid-template-columns:12px 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rc:first-of-type{border-top:0}
.rc .dot{margin-top:6px}
.dot.strong{background:var(--ok)} .dot.okay{background:var(--amber)} .dot.weak{background:var(--accent)}
.rc .area{font-weight:700}
.rc .sig{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.rc .fix{margin-top:3px;color:var(--ink)}
.rc .fix b{color:var(--accent)}
.rform{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:8px}
.rform label{font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:3px}
.rform input{padding:7px 9px;font-size:14px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{text-align:right;font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable td{text-align:right;padding:6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable td img{width:30px;height:40px;object-fit:cover;border-radius:3px;flex:0 0 auto}
.rtable .pc{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;line-height:1.3}
.rtable tr.top td{background:color-mix(in srgb,var(--ok) 9%,transparent)}
.scroll-x{overflow-x:auto}
/* reels */
.rprev{width:100%;max-width:270px;aspect-ratio:9/16;border-radius:12px;background:#000;display:block}
.rvid{width:100%;max-width:270px;border-radius:12px;background:#000}
.concept{border-top:3px solid var(--accent)}
.concept .tl{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;font-size:14px}
.concept .tl .at{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.shot{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.shot:first-child{border-top:0}
.shot .sec{font:500 11.5px var(--mono);color:var(--muted)}
.shot.done .what{text-decoration:line-through;color:var(--muted)}
.ordchips{display:flex;gap:4px;flex-wrap:wrap}
.ordchips img{width:34px;height:44px;object-fit:cover;border-radius:4px}
</style>
</head>

<header class="top"><div class="top-in">

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const RATIOS={'3:4':[3,4],'4:5':[4,5],'1:1':[1,1],'9:16':[9,16]};

const fmtDT=ts=>{const d=new Date(ts);return `${DAYS[d.getDay()]} ${d.getDate()} ${d.toLocaleString('en',{month:'short'})} · ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const toLocalInput=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
let toastT;
function toast(msg){
  // an AI call rejected for a wrong passcode or missing setup says so, whatever the caller's generic message

  else if(S&&Date.now()-(S.notConfiguredAt||0)<3000) msg='AI is not set up on the server yet. Add the Gemini key and passcode in Cloudflare.';
  const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

const DEFAULT_SETTINGS={handle:'',niche:'',city:'',voice:'Storyteller',signature:'',language:'English',tagBank:'',gearLine:true,goal:4,
  slots:{0:['10:00','18:30'],1:['08:00','19:30'],2:['08:00','13:00','19:30'],3:['08:00','19:30'],4:['08:00','13:00','19:30'],5:['08:00','20:00'],6:['10:00','18:30']}};

let AI='Claude';
const S={db:null,col:null,uid:null,assets:null,sample:null,dl:null,mode:'loading',
  posts:new Map(),shots:new Map(),settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
  view:'create',draft:null,selImg:0,reorder:false,sel:null,showGridMask:true,aiBusy:false,aiCtl:null,videos:{}};

/* ---------- EXIF (JPEG APP1) ---------- */
function parseExif(buf){
  const v=new DataView(buf); if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
  let o=2;
  while(o<v.byteLength-4){
    const m=v.getUint16(o);
    if(m===0xFFE1){ if(v.getUint32(o+4)===0x45786966) return readTiff(v,o+10); o+=2+v.getUint16(o+2); }
    else if((m&0xFF00)===0xFF00){ if(m===0xFFDA) break; o+=2+v.getUint16(o+2); }
    else break;
  }
  return null;
}
function readTiff(v,t){
  const le=v.getUint16(t)===0x4949, g16=p=>v.getUint16(p,le), g32=p=>v.getUint32(p,le);
  const names={0x010F:'make',0x0110:'model',0x829A:'exposure',0x829D:'fnumber',0x8827:'iso',0x9003:'date',0x920A:'focal',0xA405:'focal35',0xA434:'lens'};
  const out={}; let gps=0;
  function ifd(off){
    let sub=0; const base=t+off; if(base+2>v.byteLength) return 0;
    const n=g16(base);
    for(let i=0;i<n;i++){
      const e=base+2+i*12; if(e+12>v.byteLength) break;
      const tag=g16(e),type=g16(e+2),cnt=g32(e+4),vo=e+8;
      if(tag===0x8769){sub=g32(vo);continue}
      if(tag===0x8825){gps=g32(vo);continue}
      const name=names[tag]; if(!name) continue;
      try{
        if(type===2){const p=cnt>4?t+g32(vo):vo;let s='';for(let k=0;k<cnt-1&&p+k<v.byteLength;k++)s+=String.fromCharCode(v.getUint8(p+k));out[name]=s.replace(/\0/g,'').trim()}
        else if(type===3) out[name]=g16(vo);
        else if(type===4) out[name]=g32(vo);
        else if(type===5||type===10){const p=t+g32(vo);const a=g32(p),b=g32(p+4);out[name]=b?a/b:0}
      }catch(_){}
    }
    return sub;
  }
  const sub=ifd(g32(t+4)); if(sub) ifd(sub);
  if(gps){ try{
    const base=t+gps, n=g16(base), g={};
    for(let i=0;i<n;i++){
      const e=base+2+i*12, tag=g16(e), type=g16(e+2), cnt=g32(e+4), vo=e+8;
      if((tag===1||tag===3)&&type===2) g[tag]=String.fromCharCode(v.getUint8(vo));
      if((tag===2||tag===4)&&type===5&&cnt===3){ const p=t+g32(vo), r=k=>{const b=g32(p+k*8+4);return b?g32(p+k*8)/b:0}; g[tag]=r(0)+r(1)/60+r(2)/3600 }
    }
    if(g[2]!=null&&g[4]!=null&&!(g[2]===0&&g[4]===0)){ out.lat=+(g[2]*(g[1]==='S'?-1:1)).toFixed(6); out.lon=+(g[4]*(g[3]==='W'?-1:1)).toFixed(6) }
  }catch(_){} }
  if(out.date){ const m=/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(out.date); if(m) out.takenAt=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime() }
  if(out.make&&out.model&&out.model.toLowerCase().startsWith(out.make.toLowerCase().split(' ')[0])) out.make='';
  return out;
}
function exifParts(x){
  if(!x) return [];
  if(x.video) return ['Video'+(x.duration?` · ${x.duration.toFixed(1)}s`:'')];
  const p=[];
  const cam=[x.make,x.model].filter(Boolean).join(' ').replace(/\s+/g,' ').trim(); if(cam)p.push(cam);
  if(x.lens) p.push(x.lens);
  if(x.focal) p.push(Math.round(x.focal)+'mm'+(x.focal35&&Math.abs(x.focal35-x.focal)>2?` (${x.focal35}mm eq.)`:''));
  if(x.fnumber) p.push('f/'+(+x.fnumber.toFixed(1)));
  if(x.exposure) p.push(x.exposure>=1?x.exposure+'s':'1/'+Math.round(1/x.exposure)+'s');
  if(x.iso) p.push('ISO '+x.iso);
  return p;
}
/* ---------- place + time context ---------- */
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function postGeo(p){ const im=p.images.find(i=>i.exif&&i.exif.lat!=null); return im?{lat:im.exif.lat,lon:im.exif.lon}:null }
function postTaken(p){ const im=p.images.find(i=>i.exif&&i.exif.takenAt); return im?im.exif.takenAt:null }
function nearestPlace(g){
  let best=null; for(const pl of (S.settings.places||[])){ const d=distM(g.lat,g.lon,pl.lat,pl.lon); if(d<=(pl.r||300)&&(!best||d<best.d)) best={...pl,d} } return best;
}
function lightOf(h){ return h<5?'night':h<7?'dawn / early morning':h<10?'morning':h<15?'midday':h<17?'afternoon':h<19?'golden hour / evening':'night' }
function shotContext(p){
  const lines=[], tk=postTaken(p), g=postGeo(p);
  if(tk){ const d=new Date(tk), age=(Date.now()-tk)/86400000;
    lines.push(`Taken: ${d.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}, ${pad2(d.getHours())}:${pad2(d.getMinutes())} by the camera clock (roughly ${lightOf(d.getHours())}; check against the image)${age>180?`. This is about ${age>700?Math.round(age/365)+' years':Math.round(age/30)+' months'} old, so a throwback framing may fit`:''}`) }
  if(g) lines.push(`GPS: ${g.lat}, ${g.lon}${p.location?` (photographer tagged it "${p.location}")`:''}`);
  return lines.join('\n');
}
function fmtTaken(ts){const d=new Date(ts);return `${d.getDate()} ${d.toLocaleString('en',{month:'short'})} ${d.getFullYear()} · ${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function gearLine(x){
  if(!x||x.video) return '';
  const cam=[x.make,x.model].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  const s=[cam, x.focal?Math.round(x.focal)+'mm':'', x.fnumber?'f/'+(+x.fnumber.toFixed(1)):'', x.exposure?(x.exposure>=1?x.exposure+'s':'1/'+Math.round(1/x.exposure)+'s'):'', x.iso?'ISO '+x.iso:''].filter(Boolean);
  return s.length>1?'📷 '+s.join(' · '):'';
}

/* ---------- images ---------- */
const imgCache=new Map();
function getImg(src){
  if(imgCache.has(src)) return imgCache.get(src);
  const p=new Promise((res,rej)=>{const i=new Image();i.decoding='async';i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image failed to load'));i.src=src});
  imgCache.set(src,p); p.catch(()=>imgCache.delete(src)); return p;
}
async function loadBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}) }
  catch(_){ const u=URL.createObjectURL(file); try{ return await getImg(u) } finally{} }
}
function srcDims(s){return {w:s.naturalWidth||s.videoWidth||s.width,h:s.naturalHeight||s.videoHeight||s.height}}
function toJpeg(src,maxEdge,q=.9){
  const {w,h}=srcDims(src); const sc=Math.min(1,maxEdge/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r({blob:b,w:c.width,h:c.height}),'image/jpeg',q));
}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function grabVideoFrame(url,t){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
    v.onloadedmetadata=()=>{ v.currentTime=clamp(t??Math.min(1,v.duration/3),0,Math.max(0,v.duration-0.05)) };
    v.onseeked=()=>{ const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); res({canvas:c,duration:v.duration}) };
    v.onerror=()=>rej(new Error('This video format cannot be read in the browser'));
  });
}
function grabFrames(url,count){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
    const out=[]; let i=0, times=[];
    v.onloadedmetadata=()=>{ times=Array.from({length:count},(_,k)=>(k+0.5)/count*v.duration); v.currentTime=times[0] };
    v.onseeked=()=>{
      const sc=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)); const c=cv(Math.round(v.videoWidth*sc),Math.round(v.videoHeight*sc));
      c.getContext('2d').drawImage(v,0,0,c.width,c.height); out.push({canvas:c,t:times[i]}); i++;
      if(i<times.length) v.currentTime=times[i]; else res(out);
    };
    v.onerror=()=>rej(new Error('video'));
  });
}
async function storeSmall(c){
  if(S.assets){ try{ const b=await toJpeg(c,640,.8); const a=await S.assets.upload(b.blob); return a.url||('/_blob/'+a.id) }catch(_){} }
  return blobToDataURL((await toJpeg(c,320,.72)).blob);
}
async function storeImage(srcEl,maxEdge){
  const big=await toJpeg(srcEl,maxEdge,.92);
  if(S.assets){
    try{ const a=await S.assets.upload(big.blob); return {src:a.url||('/_blob/'+a.id),assetId:a.id,w:big.w,h:big.h} }
    catch(e){ console.warn('asset upload failed',e) }
  }
  const small=await toJpeg(srcEl,S.db?720:(IDB.db?2880:1440),IDB.db?.88:.82);
  return {src:await blobToDataURL(small.blob),w:big.w,h:big.h};
}
async function ingestFile(file,maxEdge=4096){
  const isVideo=(file.type||'').startsWith('video/');
  let exif={},el,videoURL=null;
  if(isVideo){ videoURL=URL.createObjectURL(file); const r=await grabVideoFrame(videoURL); el=r.canvas; exif={video:true,duration:r.duration} }
  else { try{ exif=parseExif(await file.slice(0,262144).arrayBuffer())||{} }catch(_){}; el=await loadBitmap(file) }
  const st=await storeImage(el,maxEdge);
  const im={k:newId(),src:st.src,assetId:st.assetId||null,w:st.w,h:st.h,fx:.5,fy:.5,exif,name:file.name||''};
  // keep a local high-quality copy for this session's renders
  try{ const local=await toJpeg(el,maxEdge,.92); const u=URL.createObjectURL(local.blob); imgCache.set(st.src,getImg(u)) }catch(_){}
  if(videoURL){
    S.videos[im.k]=videoURL;
    // six frames across the clip so Claude can follow what happens in it
    try{ const fr=await grabFrames(videoURL,6); im.frames=[]; for(const f of fr) im.frames.push({src:await storeSmall(f.canvas),t:+f.t.toFixed(1)}) }catch(_){}
  }
  return im;
}

/* ---------- rendering ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function coverDraw(x,src,im,W,H){
  const s=Math.max(W/im.w,H/im.h), dw=im.w*s, dh=im.h*s;
  x.drawImage(src, clamp(W/2-im.fx*dw,W-dw,0), clamp(H/2-im.fy*dh,H-dh,0), dw, dh);
}
function slideRatio(p){return p.format==='reel'?'9:16':p.ratio}
function splitCount(p){
  const im=p.images[0]; if(!im) return 2; const [rw,rh]=RATIOS[p.ratio];
  const auto=clamp(Math.round((im.w/im.h)/(rw/rh)),2,10);
  return p.slices?clamp(p.slices,2,10):auto;
}
async function renderSlides(p,W){
  const [rw,rh]=RATIOS[slideRatio(p)], H=Math.round(W*rh/rw), out=[];
  if(p.fit==='split'&&p.images.length===1&&p.format!=='reel'){
    const im=p.images[0], src=await getImg(im.src), n=splitCount(p), TW=W*n;
    let s=H/im.h; if(im.w*s<TW) s=TW/im.w;
    const dw=im.w*s, dh=im.h*s, ox=clamp(TW/2-im.fx*dw,TW-dw,0), oy=clamp(H/2-im.fy*dh,H-dh,0);
    for(let i=0;i<n;i++){const c=cv(W,H),x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,ox-i*W,oy,dw,dh);out.push(c)}
    return out;
  }
  for(const im of p.images){
    const src=await getImg(im.src), c=cv(W,H), x=c.getContext('2d'); x.imageSmoothingQuality='high';
    if(p.fit==='border'&&p.format!=='reel'){
      if(p.border==='blur'){
        const t=cv(24,Math.round(24*H/W)); coverDraw(t.getContext('2d'),src,im,t.width,t.height);
        x.imageSmoothingEnabled=true; x.drawImage(t,0,0,W,H); x.fillStyle='rgba(0,0,0,.25)'; x.fillRect(0,0,W,H);
      } else { x.fillStyle=p.border==='black'?'#000':'#fff'; x.fillRect(0,0,W,H) }
      const pd=W*(p.pad??4)/100, s=Math.min((W-2*pd)/im.w,(H-2*pd)/im.h), dw=im.w*s, dh=im.h*s;
      x.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
    } else coverDraw(x,src,im,W,H);
    out.push(c);
  }
  return out;
}
const thumbCache=new Map();
function thumbKey(p){return JSON.stringify([p.images.map(i=>[i.src.slice(-40),i.fx,i.fy]),p.ratio,p.fit,p.border,p.pad,p.format,p.slices])}
async function gridThumb(p){
  if(!p.images.length) return '';
  const k=thumbKey(p); if(thumbCache.has(k)) return thumbCache.get(k);
  const pr=(async()=>{
    const [first]=await renderSlides({...p,images:p.fit==='split'?p.images:[p.images[0]]},360);
    const H=480, c=cv(360,H), x=c.getContext('2d'), s=Math.max(360/first.width,H/first.height);
    x.drawImage(first,(360-first.width*s)/2,(H-first.height*s)/2,first.width*s,first.height*s);
    return c.toDataURL('image/jpeg',.8);
  })();
  thumbCache.set(k,pr); pr.catch(()=>thumbCache.delete(k)); return pr;
}

/* ---------- persistence ---------- */
const pend=new Map(), inflight=new Set(), timers={};
function dbBody(o){return JSON.parse(JSON.stringify(o))}
function queueSave(docId,body){
  pend.set(docId,body); clearTimeout(timers[docId]); timers[docId]=setTimeout(()=>flush(docId),700);
}
async function flush(docId){
  if(inflight.has(docId)){timers[docId]=setTimeout(()=>flush(docId),400);return}
  if(!pend.has(docId)) return;
  const body=pend.get(docId); pend.delete(docId); inflight.add(docId); setSync('saving');
  try{ if(body===null) await S.col.doc(docId).delete(); else await S.col.doc(docId).set(body); setSync('ok') }
  catch(e){
    if(e&&e.code==='unavailable'){ pend.set(docId,body); setTimeout(()=>flush(docId),1500+Math.random()*1000) }
    else { setSync('err'); toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old posts.':'Could not save. Check your connection.') }
  } finally { inflight.delete(docId); if(pend.has(docId)&&!timers[docId]) flush(docId) }
}
/* device storage: IndexedDB (no 5 MB cap), localStorage only as a last resort */
const IDB={db:null,
  open(){ return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r=indexedDB.open('reachloop',1);
    r.onupgradeneeded=()=>{ const d=r.result; for(const n of ['posts','shots','kv']) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id'}) };
    r.onsuccess=()=>{ IDB.db=r.result; res(r.result) }; r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
  }) },
  all(store){ return new Promise((res,rej)=>{ const q=IDB.db.transaction(store).objectStore(store).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error) }) },
  write(store,id,val){ return new Promise((res,rej)=>{ const t=IDB.db.transaction(store,'readwrite'), os=t.objectStore(store); if(val==null) os.delete(id); else os.put(val); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error) }) }
};
const localPend=new Map(); let localTimer=null;
function localSave(store,id,val){
  if(!IDB.db){ persistLocal(); return }
  localPend.set(store+'|'+id,{store,id,val}); clearTimeout(localTimer); localTimer=setTimeout(flushLocal,500);
}
async function flushLocal(){
  const jobs=[...localPend.values()]; localPend.clear();
  for(const j of jobs){ try{ await IDB.write(j.store,j.id,j.val) }catch(e){ toast(e&&e.name==='QuotaExceededError'?'Your phone is out of space for reachloop. Delete old posts or back up and clear.':'Could not save on this device.') } }
}
window.addEventListener('pagehide',()=>{ if(localPend.size) flushLocal() });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&localPend.size) flushLocal() });
function persistLocal(){
  try{ localStorage.setItem('contactsheet_v1',JSON.stringify({posts:[...S.posts.values()],shots:[...S.shots.values()],settings:S.settings})) }
  catch(_){ toast('This browser could not keep the post. It will last until you close the page.') }
}
function savePost(p){
  p.updatedAt=Date.now();
  if(p.scheduledAt&&p.status==='draft') p.status='scheduled';
  if(!p.scheduledAt&&p.status==='scheduled') p.status='draft';
  S.posts.set(p.id,dbBody(p));
  if(S.col) queueSave('p_'+p.id,dbBody(p)); else localSave('posts',p.id,dbBody(p));
}
function deletePost(id){
  S.posts.delete(id);
  if(S.col) queueSave('p_'+id,null); else localSave('posts',id,null);
}

function setSync(state){
  const el=$('#sync'); if(!el) return;
  const map={ok:['ok','Synced'],saving:['','Saving…'],err:['warn','Not saved'],local:['warn','This device only'],loading:['','Connecting…'],offline:['warn','Waiting for sync']};
  const [c,t]=map[state]||map.ok; el.innerHTML=`<span class="dot ${c}"></span><span>${t}</span>`;
}

/* ---------- boot ---------- */
async function boot(){
  renderNav(); go(location.hash.replace('#','')||'create');
  // Claude only ever serves this page inside a frame; standalone (the installed app) starts straight away
  const framed=(()=>{ try{ return window.top!==window }catch(_){ return true } })();
  let tries=0; while(framed&&!(window.claude&&window.claude.use)&&tries<30){await new Promise(r=>setTimeout(r,100));tries++}
  if(!(window.claude&&window.claude.use)) return startLocal();
  const use=n=>window.claude.use(n).catch(()=>null);
  const [db,user,assets,sample,dl]=await Promise.all([use('db'),use('user'),use('assets'),use('sample'),use('downloads')]);
  S.assets=assets; S.sample=sample; S.dl=dl;
  let uid=null; try{ uid=user?await user.id():null }catch(_){}
  if(!db||!uid){ await startLocal(); refreshAICard(); return }
  S.db=db; S.uid=uid; S.col=db.collection('data/users/'+uid);
  let first=true; const tm=setTimeout(()=>{ if(first) setSync('offline') },10000);
  S.col.onSnapshot(snap=>{
    const posts=new Map(), shots=new Map();
    for(const d of snap.docs){ const b=d.data(); if(!b) continue;
      if(d.id==='settings') S.settings={...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),...b,slots:{...DEFAULT_SETTINGS.slots,...(b.slots||{})}};
      else if(d.id.startsWith('p_')) posts.set(b.id,b);
      else if(d.id.startsWith('sl_')) shots.set(b.id,b);
    }
    // keep local unsaved edits on top
    for(const [id,body] of pend){
      if(id.startsWith('p_')){ if(body) posts.set(body.id,body); else posts.delete(id.slice(2)) }
      if(id.startsWith('sl_')){ if(body) shots.set(body.id,body); else shots.delete(id.slice(3)) }
    }
    S.posts=posts; S.shots=shots;
    if(!snap.metadata.fromCache){ first=false; clearTimeout(tm); setSync('ok') }
    // views with text inputs keep focus: only repaint their lists
    const ae=document.activeElement, typing=ae&&$('#main').contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if((S.view==='grid'||S.view==='plan')&&!typing) render(); else if(S.view==='reels') paintShots();
  },e=>{ clearTimeout(tm); setSync('err'); if(e.code!=='revoked') toast('Sync stopped. Your changes on this page may not be saved.') });
  S.mode='db'; refreshAICard();
}
function applySettings(o){ S.settings={...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),...o,slots:{...DEFAULT_SETTINGS.slots,...((o&&o.slots)||{})}} }
async function startLocal(){
  S.mode='local'; S.web=!(window.claude&&window.claude.use); setSync('local'); enableWebAI();
  let legacy=null; try{ const raw=localStorage.getItem('contactsheet_v1'); if(raw) legacy=JSON.parse(raw) }catch(_){}
  try{
    await IDB.open();
    const [posts,shots,kv]=await Promise.all([IDB.all('posts'),IDB.all('shots'),IDB.all('kv')]);
    if(!posts.length&&!shots.length&&!kv.length&&legacy){
      // one-time move from the old browser storage
      for(const p of legacy.posts||[]) await IDB.write('posts',p.id,p);
      for(const x of legacy.shots||[]) await IDB.write('shots',x.id,x);
      if(legacy.settings) await IDB.write('kv','settings',{id:'settings',v:legacy.settings});
      try{ localStorage.removeItem('contactsheet_v1') }catch(_){}
      return startLocal();
    }
    posts.forEach(p=>S.posts.set(p.id,p)); shots.forEach(x=>S.shots.set(x.id,x));
    const st=kv.find(x=>x.id==='settings'); if(st) applySettings(st.v);
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(_){}
  }catch(_){
    IDB.db=null;
    if(legacy){ (legacy.posts||[]).forEach(p=>S.posts.set(p.id,p)); (legacy.shots||[]).forEach(x=>S.shots.set(x.id,x)); if(legacy.settings) applySettings(legacy.settings) }
  }
  render();
}

async function guessLocation(){
  const p=D(), g=postGeo(p); if(!g||!S.sample||S.locBusy) return;
  S.locBusy=true; paintLoc();
  try{
    const r=await S.sample.json(`A photographer's photo has GPS coordinates ${g.lat}, ${g.lon}. Their home city is ${S.settings.city||'not given'}. Suggest the location tag they would use on Instagram: the most likely well-known place, landmark, market, lake, neighbourhood or area at or very near those coordinates, followed by the city (e.g. "Ulsoor Lake, Bengaluru"). If you are not sure of a specific landmark, give the neighbourhood and city instead. Do not invent places.
Reply with only JSON: {"name":"","confidence":"high|medium|low","note":"short reason or what to double-check"}`,{modelTier:'default'});
    if(!r||!r.name) throw {code:'invalid_json'};
    S.locGuess={pid:p.id,name:String(r.name),confidence:String(r.confidence||'medium'),note:String(r.note||'')};
    if(!p.location){ p.location=S.locGuess.name; p.locSource='guess'; $('#loc').value=p.location; touch() }
  }catch(e){ toast({rate_limited:`${AI} is busy or your usage limit was reached.`}[e&&e.code]||'Could not suggest a name. Type it instead.') }
  S.locBusy=false; paintLoc(); paintReach();
}

async function addFiles(files){
  const p=D(); files=files.filter(f=>/^(image|video)\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp|mp4|mov)$/i.test(f.name));
  if(!files.length) return;
  const room=20-p.images.length; if(room<=0){toast('Instagram allows up to 20 slides.');return}
  files=files.slice(0,room);
  const hint=$('#drop strong')||$('#rAddMsg')||document.createElement('span'); const old=hint.textContent;
  let done=0;
  for(const f of files){
    hint.textContent=`Preparing ${++done} of ${files.length}${/^video\//.test(f.type)?' (reading the clip)':''}…`;
    try{ const im=await ingestFile(f); p.images.push(im); if(im.exif.video) p.format='reel' }
    catch(e){ toast(`${f.name}: ${/heic|heif/i.test(f.name)?'HEIC could not be read here. Export as JPEG.':'could not be read.'}`) }
  }
  hint.textContent=old;
  if(!p.location){ const g=postGeo(p), near=g&&nearestPlace(g); if(near){ p.location=near.name; p.locSource='saved'; toast(`Tagged "${near.name}" from GPS`) } }
  autoFormat(p); p.alt.length=p.images.length; if(p.reelBuild) p.reelBuild.order=p.images.map((_,i)=>i+1); savePost(p); render();
}
function paintStrip(){

   +(p.images.length>1?`<div class="row" style="flex-direction:column;justify-content:center;gap:4px"><button class="btn sm" id="mvL" aria-label="Move selected slide left">←</button><button class="btn sm" id="mvR" aria-label="Move selected slide right">→</button></div>`:'');

    const t=e.target.closest('.thumb'); if(t){S.selImg=+t.dataset.i; paintStrip(); paintFocal(); return}
    if(e.target.id==='mvL'||e.target.id==='mvR'){

    }

async function aiImages(p){
  const lim=await S.sample.limits().catch(()=>null);
  if(!(lim&&lim.images)) return {blobs:undefined,labels:[]};
  const max=Math.min(lim.images.maxCount||6,12);
  const items=[];
  p.images.forEach((im,i)=>{
    if(im.frames&&im.frames.length) im.frames.forEach(f=>items.push({src:f.src,label:`slide ${i+1} is a video clip${im.exif.duration?' of '+im.exif.duration.toFixed(1)+'s':''}; frame at ${f.t}s`}));
    else items.push({src:im.src,label:`slide ${i+1}, ${im.exif&&im.exif.video?'video cover frame':'photo'}`});
  });
  let pick=items;
  if(items.length>max){ const step=items.length/max; pick=Array.from({length:max},(_,k)=>items[Math.floor(k*step)]) }
  const blobs=[];
  for(const it of pick){ try{ const s=await getImg(it.src); blobs.push((await toJpeg(s,1024,.85)).blob) }catch(_){ blobs.push(null) } }
  const keep=pick.filter((_,k)=>blobs[k]);
  return {blobs:blobs.filter(Boolean),labels:keep.map((it,k)=>`Image ${k+1}: ${it.label}`)};

function nextFreeSlot(exceptId){
  const taken=new Set([...S.posts.values()].filter(x=>x.id!==exceptId&&x.scheduledAt&&x.status!=='posted').map(x=>new Date(x.scheduledAt).toDateString()));
  const now=Date.now()+30*60000;
  for(let d=0;d<21;d++){
    const day=new Date(); day.setHours(0,0,0,0); day.setDate(day.getDate()+d);
    if(taken.has(day.toDateString())) continue;
    for(const t of [...(S.settings.slots[day.getDay()]||[])].sort()){
      const [h,mi]=t.split(':').map(Number); const at=new Date(day); at.setHours(h,mi,0,0);
      if(at.getTime()>now) return at.getTime();
    }
  }
  return null;
}

  if(window.VideoEncoder&&window.Mp4Muxer){
    let cfg=null;
    for(const codec of ['avc1.640028','avc1.4d0028','avc1.420028']){
      const t={codec,width:W,height:H,bitrate:10_000_000,framerate:fps};
      try{ const s=await VideoEncoder.isConfigSupported(t); if(s.supported){cfg=t;break} }catch(_){}
    }
    if(cfg){
      const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
      let err=null; const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{err=e}});
      enc.configure(cfg);
      for(let i=0;i<N;i++){
        if(err) throw err;
        drawReel(x,W,H,i/fps,b,list);
        const vf=new VideoFrame(c,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
        enc.encode(vf,{keyFrame:i%(fps*2)===0}); vf.close();
        while(enc.encodeQueueSize>8) await new Promise(r=>setTimeout(r,4));
        if(i%6===0){ onProg(i/N); await new Promise(r=>setTimeout(r,0)) }
      }
      await enc.flush(); if(err) throw err; muxer.finalize();
      return {blob:new Blob([muxer.target.buffer],{type:'video/mp4'}),ext:'mp4'};
    }
  }
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mime) throw new Error('This browser cannot make videos. Try Chrome or Safari.');
  const rec=new MediaRecorder(c.captureStream(fps),{mimeType:mime,videoBitsPerSecond:10_000_000}), chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>rec.onstop=r); rec.start(250);
  const t0=performance.now();
  await new Promise(r=>{const step=()=>{const t=(performance.now()-t0)/1000; drawReel(x,W,H,Math.min(t,total),b,list); onProg(t/total); if(t<total) requestAnimationFrame(step); else r()}; requestAnimationFrame(step)});
  rec.stop(); await stopped;
  return {blob:new Blob(chunks,{type:mime.split(';')[0]}),ext:mime.includes('mp4')?'mp4':'webm'};
}

When / how long: ${f.when||'not given'}
Hoping to capture: ${f.what||'not given'}
Gear: ${f.gear||'camera, plus a phone'}

Give 8 to 12 clips, each 3 to 8 seconds, filmed vertically. Mix: an establishing wide, details and textures, hands on the camera (behind the scenes, phone on chest or a small tripod), a POV walking shot, motion (people, vehicles, light), sound-rich moments, one or two transition-friendly shots (whip pan, cover the lens, match cut), and the moment the shutter is pressed.
Be specific to the place and time of day. Keep "how" to one practical line (angle, framing, motion). "use" names which reel the clip serves.
Add 4 to 6 photographs worth getting, 2 reel concepts these clips set up, a note on capturing ambient sound, and 3 short tips (light at that hour, respectful street photography etiquette, battery or storage).

Reply with only JSON:
{"title":"short name for the outing","summary":"one line","clips":[{"shot":"","seconds":4,"how":"","use":""}],"stills":[""],"reels":[{"name":"","uses":"clips 1, 4, 7"}],"sound":"","tips":[""]}`;
  try{
    const r=await S.sample.json(prompt,{cache:false});
    if(!r||!Array.isArray(r.clips)) throw {code:'invalid_json'};
    const doc={id:newId(),createdAt:Date.now(),where:f.where||'',when:f.when||'',what:f.what||'',title:String(r.title||f.where||'Shot list'),summary:String(r.summary||''),
      clips:r.clips.slice(0,14).map(c=>({shot:String(c.shot||''),seconds:c.seconds||'',how:String(c.how||''),use:String(c.use||'')})),
      stills:(r.stills||[]).map(String).slice(0,8),reels:(r.reels||[]).slice(0,3).map(x=>({name:String(x.name||''),uses:String(x.uses||'')})),sound:String(r.sound||''),tips:(r.tips||[]).map(String).slice(0,4),done:{}};
    saveShot(doc); S.openShot=doc.id; S.shotForm={}; toast('Shot list ready');
  }catch(e){
    const msg={not_granted:`${AI} was not allowed for this page.`,rate_limited:`${AI} is busy or your usage limit was reached.`,invalid_json:'The plan came back garbled. Try again.'}[e&&e.code];
    toast(msg||'Something went wrong. Try again.');
    if(e&&['not_granted','sampling_disabled'].includes(e.code)) S.sample=null;
  }
  S.shotBusy=false; if(document.activeElement) document.activeElement.blur(); paintShots();
}

  <div class="two">
    <div class="card stack">

      <label class="f" for="pNiche">What you shoot <span class="hint">Your niche in a few words. Specific grows faster than "photography".</span><input type="text" id="pNiche" value="${esc(s.niche)}" placeholder="e.g. street and temple architecture, South India"></label>
      <label class="f" for="pCity">Home city <input type="text" id="pCity" value="${esc(s.city)}" placeholder="e.g. Bengaluru"></label>
      <label class="f" for="pFol">Followers, roughly <span class="hint">Used for advice like Trial Reels (1,000+ followers).</span><input type="number" id="pFol" min="0" value="${esc(s.followers||'')}" placeholder="e.g. 850"></label>
      <label class="f" for="pVoice">Caption voice <select id="pVoice">${['Storyteller','Minimal','Poetic','Technical (gear and settings forward)','Witty','Warm and personal'].map(v=>`<option ${v===s.voice?'selected':''}>${v}</option>`).join('')}</select></label>
      <label class="f" for="pLang">Language(s) <span class="hint">e.g. "English with an occasional Tamil phrase"</span><input type="text" id="pLang" value="${esc(s.language)}"></label>
    </div>
    <div class="card stack">
      <label class="f" for="pSig">Signature line <span class="hint">Added after the caption. Keep it short.</span><input type="text" id="pSig" value="${esc(s.signature)}" placeholder="e.g. Prints on request · DM"></label>
      <label class="f" for="pBank">Your go-to hashtags <span class="hint">Shown as one-tap chips in Create. Separate with spaces.</span><textarea id="pBank" rows="3" placeholder="bangalorediaries indianstreetphotography fujifilm_xseries">${esc(s.tagBank)}</textarea></label>
      <label class="small row" style="gap:8px"><input type="checkbox" id="pGear" ${s.gearLine?'checked':''}> Add a camera line (📷 body · lens · settings) under captions</label>
      <div class="stack" style="gap:4px"><h3>Saved places</h3>
        <div id="placeList">${(s.places||[]).length?(s.places||[]).map((pl,i)=>`<div class="row" style="justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><span><strong>${esc(pl.name)}</strong> <span class="mono muted">${(+pl.lat).toFixed(4)}, ${(+pl.lon).toFixed(4)}</span></span><span class="row" style="gap:4px"><a class="btn sm ghost" href="https://www.google.com/maps?q=${pl.lat},${pl.lon}" target="_blank" rel="noopener">Map ↗</a><button class="btn sm ghost danger" data-delpl="${i}">Remove</button></span></div>`).join(''):'<p class="muted small" style="margin:0">None yet. When a photo has GPS, type the place name in Create and tap "Save as a place". Photos taken within 300 m are then tagged for you.</p>'}</div></div>
      <div class="tip small">Reach basics that still work in 2026: post Reels alongside photos, reply to comments fast, and send good posts to friends; shares in DMs count as a strong signal.</div>

  ${S.mode==='local'?`<div class="card stack" style="margin-top:16px" id="deviceCard">

    <p class="small" style="margin:0">Your posts and photos live on this ${S.web?'phone or computer':'browser'} only. Back up now and then, and use the backup file to move everything to another device.${backupAge()}</p>
    <div class="row"><button class="btn primary" id="backupBtn">Back up everything</button><button class="btn" id="restoreBtn">Restore from a backup</button><input type="file" id="restorePick" accept=".json,application/json" class="hide"></div>
    <div id="backupOut"></div>

  if(S.web){ m.insertAdjacentHTML('beforeend',aiCardHTML()); bindAICard(m) }

/* ---------- installed app: install, backup, restore ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(S.view==='profile'&&S.mode==='local') render() });
window.addEventListener('appinstalled',()=>{ installEvt=null; toast('reachloop is on your home screen'); if(S.view==='profile') render() });
const isStandalone=()=>{ try{ return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true }catch(_){ return false } };
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBlock(){
  if(isStandalone()) return `<p class="small" style="margin:0"><span class="pill posted">Installed</span> You're using the home-screen app.</p>`;
  if(installEvt) return `<div class="row"><button class="btn ink" id="installBtn">Install reachloop</button><span class="muted small">Adds it to your home screen; works offline.</span></div>`;
  if(isIOS()) return `<p class="small" style="margin:0"><strong>Install on iPhone:</strong> open this page in Safari, tap Share, then <em>Add to Home Screen</em>.</p>`;
  return `<p class="small" style="margin:0"><strong>Install:</strong> open your browser's menu and choose <em>Install app</em> or <em>Add to Home screen</em>.</p>`;
}
function backupAge(){
  const t=S.settings.lastBackup; if(!t) return ' <strong>No backup yet.</strong>';
  const d=Math.floor((Date.now()-t)/86400000);
  return ` Last backup: ${d===0?'today':d===1?'yesterday':d+' days ago'}.${d>14?' <strong>Time for a fresh one.</strong>':''}`;
}
function bindDeviceCard(m){
  (async()=>{ try{ const e=await navigator.storage.estimate(); const u=$('#usage'); if(u&&e&&e.usage!=null) u.textContent=`${(e.usage/1048576).toFixed(e.usage>1e8?0:1)} MB used` }catch(_){} })();
  $('#installBtn')&&($('#installBtn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice }catch(_){} installEvt=null; render() });
  $('#backupBtn').onclick=async()=>{
    if(localPend.size) await flushLocal();
    const data={app:'reachloop',version:1,exportedAt:new Date().toISOString(),posts:[...S.posts.values()],shots:[...S.shots.values()],settings:S.settings};
    const name=`reachloop-backup-${new Date().toISOString().slice(0,10)}.json`;
    const file=new File([JSON.stringify(data)],name,{type:'application/json'});
    S.settings.lastBackup=Date.now(); saveSettings();
    if(S.dl){ try{ await S.dl.save({filename:name,data:file}); toast('Backup saved') }catch(e){ if(e.code!=='declined') toast('Could not save the backup here.') } return }
    $('#backupOut').innerHTML=`<p class="small" style="margin:0">${S.posts.size} posts, ${S.shots.size} shot lists, ${file.size<1048576?Math.max(1,Math.round(file.size/1024))+' KB':(file.size/1048576).toFixed(1)+' MB'}. Keep it somewhere safe, like Google Drive.</p><div id="backupFile"></div>`;
    offerFiles($('#backupFile'),[file],'Share or save the backup');
  };
  $('#restoreBtn').onclick=()=>$('#restorePick').click();
  $('#restorePick').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    let o; try{ o=JSON.parse(await f.text()) }catch(_){ toast('That file is not a reachloop backup.'); return }
    if(!o||o.app!=='reachloop'||!Array.isArray(o.posts)){ toast('That file is not a reachloop backup.'); return }
    let added=0, updated=0;
    for(const p of o.posts){ if(!p||!p.id) continue; const cur=S.posts.get(p.id); if(!cur){added++} else if((p.updatedAt||0)>(cur.updatedAt||0)){updated++} else continue; S.posts.set(p.id,p); if(S.col) queueSave('p_'+p.id,p); else localSave('posts',p.id,p) }
    for(const x of o.shots||[]){ if(!x||!x.id) continue; const cur=S.shots.get(x.id); if(cur&&(cur.updatedAt||0)>=(x.updatedAt||0)) continue; S.shots.set(x.id,x); if(S.col) queueSave('sl_'+x.id,x); else localSave('shots',x.id,x) }
    if(o.settings){ const places=[...(S.settings.places||[])]; for(const pl of o.settings.places||[]) if(!places.some(q=>q.name===pl.name)) places.push(pl); applySettings({...o.settings,places,lastBackup:S.settings.lastBackup}); saveSettings() }
    thumbCache.clear(); render(); toast(`Restored: ${added} new post${added===1?'':'s'}, ${updated} updated`);
  };
}

/* ---------- AI writing in the installed app: same interface as Claude's sample, served by /api/ai ---------- */
const PASS_KEY='reachloop_ai_pass';
function getPass(){ try{ return localStorage.getItem(PASS_KEY)||'' }catch(_){ return '' } }
function setPass(v){ try{ v?localStorage.setItem(PASS_KEY,v):localStorage.removeItem(PASS_KEY) }catch(_){} }
const b64=blob=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]||'');f.onerror=()=>rej(f.error);f.readAsDataURL(blob)});
function parseLooseJSON(t){
  try{ return JSON.parse(t) }catch(_){}
  const fence=/```(?:json)?\s*([\s\S]*?)```/.exec(t); if(fence){ try{ return JSON.parse(fence[1]) }catch(_){} }
  const a=t.search(/[\[{]/), z=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>=0&&z>a){ try{ return JSON.parse(t.slice(a,z+1)) }catch(_){} }
  throw {code:'invalid_json',text:t};
}
async function aiCall(prompt,opts={},wantJson=false){
  const images=opts.images?await Promise.all([].concat(opts.images).filter(Boolean).slice(0,12).map(b64)):[];
  let r;
  try{
    r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json','x-passcode':getPass()},body:JSON.stringify({prompt:typeof prompt==='string'?prompt:prompt.map(m=>m.content).join('\n\n'),images,json:wantJson}),signal:opts.signal});
  }catch(e){ throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error',message:'network'} }
  const d=await r.json().catch(()=>({}));
  if(r.status===401){ S.authFailAt=Date.now(); throw {code:'bad_passcode'} }
  if(r.status===503){ S.notConfiguredAt=Date.now(); throw {code:'not_configured'} }
  if(r.status===429) throw {code:'rate_limited'};
  if(r.status===422) throw {code:'refused'};
  if(!r.ok||!d.text) throw {code:'upstream_error',message:d.detail||d.error||''};
  if(opts.onText) try{ opts.onText({text:d.text,delta:d.text}) }catch(_){}
  return d;
}
function makeWebSample(){
  const f=async(prompt,opts)=>{ const d=await aiCall(prompt,opts,false); return {text:d.text,truncated:!!d.truncated,modelTierApplied:'default'} };
  f.json=async(prompt,opts)=>parseLooseJSON((await aiCall(prompt,opts,true)).text);
  f.limits=async()=>({maxPromptBytes:200000,images:{maxCount:12,maxInputBytes:20e6,mediaTypes:['image/jpeg']}});
  return f;
}
function enableWebAI(){ if(S.web&&getPass()){ S.sample=makeWebSample(); AI='AI' } }
async function testWebAI(pass){
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json','x-passcode':pass},body:JSON.stringify({ping:true})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok) return {ok:true,model:d.model};
    return {ok:false,why:r.status===401?'That passcode is not right.':r.status===503?'AI is not set up on the server yet: add GEMINI_API_KEY and APP_PASSCODE in Cloudflare.':r.status===404?'The AI function is not deployed yet.':'The AI service did not answer.'};
  }catch(_){ return {ok:false,why:'No connection. Check your internet and try again.'} }
}
function aiCardHTML(){
  const on=!!(S.sample&&getPass());
  return `<div class="card stack" style="margin-top:16px" id="aiSetup">
    <div class="row" style="justify-content:space-between"><h3>AI writing</h3>${on?'<span class="pill posted">On</span>':'<span class="pill">Off</span>'}</div>
    <p class="small" style="margin:0">Captions, hashtags, reach checks, reel ideas, shot lists and place names. Your Gemini key stays on the server; this device only keeps your passcode.</p>
    <div class="row"><input type="password" id="aiPass" autocomplete="current-password" placeholder="Your reachloop passcode" value="${on?'••••••••':''}" style="max-width:260px" aria-label="AI passcode">
      <button class="btn ${on?'':'primary'}" id="aiPassSave">${on?'Change':'Turn on'}</button>${on?'<button class="btn ghost sm" id="aiPassOff">Turn off</button>':''}</div>
    <p class="small muted" style="margin:0" id="aiPassMsg"></p>
  </div>`;
}
function bindAICard(m){
  const inp=$('#aiPass'); if(!inp) return;
  inp.onfocus=()=>{ if(inp.value==='••••••••') inp.value='' };
  $('#aiPassSave').onclick=async()=>{
    const v=inp.value.trim(); if(!v||v==='••••••••'){ $('#aiPassMsg').textContent='Type your passcode first.'; return }
    $('#aiPassMsg').textContent='Checking…';
    const t=await testWebAI(v);
    if(t.ok){ setPass(v); enableWebAI(); toast('AI writing is on'); renderProfile(m) }
    else $('#aiPassMsg').textContent=t.why;
  };
  $('#aiPassOff')&&($('#aiPassOff').onclick=()=>{ setPass(''); S.sample=null; toast('AI writing is off'); renderProfile(m) });
}

/* ---------- photos shared into the app from the gallery (Android) ---------- */
async function takeSharedFiles(){
  if(!/[?&]shared=1/.test(location.search)||!('caches' in window)) return;
  try{
    const c=await caches.open('reachloop-share'), keys=await c.keys(), files=[];
    for(const k of keys){ const r=await c.match(k); const b=await r.blob(); files.push(new File([b],decodeURIComponent(k.url.split('/').pop())||'shared',{type:b.type})); await c.delete(k) }
    history.replaceState(null,'',location.pathname+'#create');
    if(files.length){ S.draft=newDraft(); S.selImg=0; go('create'); await addFiles(files); toast(`${files.length} shared ${files.length>1?'files':'file'} added`) }
  }catch(_){}
}
function registerSW(){
  try{
    const top=window.top===window, local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    if(!('serviceWorker' in navigator)||!top||(location.protocol!=='https:'&&!local)||/claude\.ai$|claudeusercontent\.com$|anthropic\.com$/.test(location.hostname)) return;
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(_){}
}

registerSW();
boot().then(takeSharedFiles);
